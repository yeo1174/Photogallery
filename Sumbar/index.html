<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Sumbar — Photos</title>
 <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
 <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body { font-family: 'Playfair Display', 'Bodoni', Georgia, serif; background: #ffffff; color: #3E3228; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .header { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 28px; flex: 0 0 auto; }
  .header .wordmark { font-weight: 700; font-size: 13pt; letter-spacing: -0.01em; color: #a6192e; text-decoration: none; }
  .header nav { display: flex; gap: 26px; }
  .header nav a { font-size: 8.5pt; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #a08d7d; text-decoration: none; transition: color .2s; }
  .header nav a:hover { color: #a6192e; }

  .stage { flex: 1 1 auto; position: relative; display: flex; align-items: center; justify-content: center; padding: 8px 76px; min-height: 0; }
  .stage img { max-height: 74vh; max-width: 100%; display: block; object-fit: contain; }

  .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 36pt; line-height: 1; color: #a6192e; cursor: pointer; padding: 12px; user-select: none; -webkit-user-select: none; transition: opacity .2s; }
  .nav-arrow:hover:not(:disabled) { opacity: .55; }
  .nav-arrow:disabled { opacity: .12; cursor: default; }
  .nav-arrow.prev { left: 6px; }
  .nav-arrow.next { right: 6px; }

  .counter { flex: 0 0 auto; text-align: center; font-size: 9pt; letter-spacing: 0.08em; color: #b0a294; padding-bottom: 16px; }
  .grid-icon { position: fixed; bottom: 52px; left: 26px; color: #a6192e; text-decoration: none; font-size: 13pt; opacity: .75; transition: opacity .2s; z-index: 5; }
  .grid-icon:hover { opacity: 1; }

  footer { flex: 0 0 auto; background: #f7f4ef; display: flex; justify-content: space-between; align-items: center; padding: 13px 28px; font-size: 8pt; color: #8f7a68; }
  footer .links a { color: #a08d7d; text-decoration: none; margin-left: 16px; letter-spacing: 0.06em; text-transform: uppercase; font-size: 7.5pt; }
  footer .links a:hover { color: #a6192e; }

  @media (max-width: 600px) {
   .header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 20px 10px; }
   .header nav { gap: 18px; }
   .stage { padding: 6px 48px; }
   .nav-arrow { font-size: 26pt; padding: 8px; }
   .nav-arrow.prev { left: 2px; }
   .nav-arrow.next { right: 2px; }
   .grid-icon { bottom: 58px; left: 18px; }
  }
 </style>
</head>
<body>

<header class="header">
 <a class="wordmark" href="/Photogallery/">yeo@photos</a>
 <nav>
  <a href="/Photogallery/">All Albums</a>
 </nav>
</header>

<main class="stage" id="stage">
 <button class="nav-arrow prev" id="prev" aria-label="Previous photo">&lsaquo;</button>
 <img id="photo" src="SUMBAR%20-%201%20of%2024.jpeg" alt="Sumbar photo 1 of 8">
 <button class="nav-arrow next" id="next" aria-label="Next photo">&rsaquo;</button>
</main>

<div class="counter"><span id="counter">1 / 8</span></div>
<a class="grid-icon" href="/Photogallery/" title="All albums" aria-label="All albums">&#9638;</a>

<footer>
 <span>&copy; 2026 yeo@photos</span>
 <span class="links"><a href="/Photogallery/">All Albums</a></span>
</footer>

<script>
 (function () {
  var photos = ["SUMBAR%20-%201%20of%2024.jpeg","SUMBAR%20-%202%20of%2024.jpeg","SUMBAR%20-%203%20of%2024.jpeg","SUMBAR%20-%204%20of%2024.jpeg","SUMBAR%20-%205%20of%2024.jpeg","SUMBAR%20-%208%20of%2024.jpeg","SUMBAR%20-%209%20of%2024.jpeg","SUMBAR%20-%2014%20of%2024.jpeg"];
  var i = 0;
  var img = document.getElementById('photo');
  var counter = document.getElementById('counter');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');

  function preload(n) {
   if (n >= 0 && n < photos.length) { var p = new Image(); p.src = photos[n]; }
  }
  function show(n) {
   i = Math.max(0, Math.min(photos.length - 1, n));
   img.src = photos[i];
   img.alt = 'Sumbar photo ' + (i + 1) + ' of ' + photos.length;
   counter.textContent = (i + 1) + ' / ' + photos.length;
   prev.disabled = (i === 0);
   next.disabled = (i === photos.length - 1);
   preload(i + 1);
  }

  prev.addEventListener('click', function () { show(i - 1); });
  next.addEventListener('click', function () { show(i + 1); });
  document.addEventListener('keydown', function (e) {
   if (e.key === 'ArrowLeft') show(i - 1);
   if (e.key === 'ArrowRight') show(i + 1);
  });

  var stage = document.getElementById('stage');
  var touchX = null;
  stage.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
   if (touchX === null) return;
   var dx = e.changedTouches[0].clientX - touchX;
   if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
   touchX = null;
  }, { passive: true });

  show(0);
 })();
</script>

</body>
</html>
