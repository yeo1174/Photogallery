<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>yeo@photos — Portfolio</title>
 <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
 <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #ffffff; color: #14110f; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  .brand { max-width: 900px; margin: 0 auto; padding: 56px 28px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .brand .mark { height: 87px; width: auto; display: block; mix-blend-mode: multiply; }
  .brand .wordmark { font-size: 10pt; letter-spacing: 0.34em; text-transform: uppercase; color: #14110f; }

  .intro { max-width: 900px; margin: 0 auto; padding: 42px 28px 36px; text-align: center; }
  .intro h1 { font-family: 'Playfair Display', 'Bodoni', Georgia, serif; font-weight: 400; font-size: 34pt; color: #14110f; margin-bottom: 12px; }
  .intro p { font-size: 10.5pt; font-weight: 300; color: #6b645e; max-width: 460px; margin: 0 auto; line-height: 1.85; }

  .albums { max-width: 900px; margin: 0 auto; padding: 6px 28px 44px; display: flex; flex-direction: column; gap: 62px; }
  .album { display: block; width: 100%; max-width: 430px; margin: 0 auto; }
  .album .cover { width: 100%; aspect-ratio: 3/4; overflow: hidden; background: #f6f5f3; }
  .album .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
  .album:hover .cover img { transform: scale(1.02); }
  .album .caption { padding: 16px 2px 0; text-align: center; }
  .album .caption .title { display: block; font-family: 'Playfair Display', 'Bodoni', Georgia, serif; font-size: 15pt; color: #14110f; }
  .album .caption .meta { display: block; margin-top: 7px; font-size: 8pt; letter-spacing: 0.16em; text-transform: uppercase; color: #a29a92; }

  footer { max-width: 900px; margin: 0 auto; padding: 34px 28px 46px; border-top: 1px solid #eee; font-size: 8pt; letter-spacing: 0.14em; text-transform: uppercase; color: #b3aca4; text-align: center; }

  @media (max-width: 520px) {
   .brand { padding-top: 38px; }
   .intro { padding: 30px 22px 26px; }
   .intro h1 { font-size: 26pt; }
   .albums { padding: 4px 22px 34px; gap: 46px; }
  }
 </style>
</head>
<body>

<div class="brand">
 <img class="mark" src="/Photogallery/logo.webp" alt="yeo@photos">
 <div class="wordmark">yeo@photos</div>
</div>

<div class="intro">
 <h1>Portfolio</h1>
 <p>A personal photography portfolio by Yeo. Selected frames, presented plainly.</p>
</div>

<div class="albums">

 <a href="/Photogallery/Monochrome%202026/" class="album">
  <div class="cover"><img src="/Photogallery/Monochrome%202026/Monochrome%202026%20-%201%20of%208.webp" alt="Monochrome 2026" loading="eager"></div>
  <div class="caption">
   <span class="title">Monochrome 2026</span>
   <span class="meta">Black & white series &middot; Sony RX100 VA &middot; 8 photos</span>
  </div>
 </a>

</div>

<footer>
 yeo@photos &middot; Photography Portfolio
</footer>

</body>
</html>
